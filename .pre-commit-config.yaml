# ABOUTME: Pre-commit hooks configuration for ccvault project
# ABOUTME: Runs formatting, linting, and tests before each commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^go\.(mod|sum)$
      - id: end-of-file-fixer
        exclude: ^go\.(mod|sum)$
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Block files > 1MB (except binary)
        exclude: ^ccvault$  # Allow the binary
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # gofmt reformats doc comments as well as code, and that includes the
      # legacy godoc typographic convention: inside a comment attached to a
      # declaration, `` becomes a left double quote and '' becomes a right
      # double quote. It is upstream Go behaviour with no flag to disable it,
      # so -d is here to make it visible — the hook prints the diff it wrote
      # back instead of only naming the file. Free-floating comments and
      # single quotes such as '%' are untouched; only the paired forms are
      # rewritten, and a doc comment that needs them should put them in a
      # backquoted code span.
      - id: go-fmt
        args: ['-d']
      - id: go-imports
      - id: go-mod-tidy
      # --allow-parallel-runners: golangci-lint takes an exclusive lock by
      # default and fails with "parallel golangci-lint is running" rather
      # than waiting, so two concurrent commits in this repo turn one commit
      # into a spurious hook failure.
      - id: golangci-lint
        args: ['--timeout=10m', '--fix', '--allow-parallel-runners']
      - id: go-unit-tests
        args: ['-race', '-count=1', './...']  # -count=1 disables test caching

  - repo: local
    hooks:
      - id: go-mod-verify
        name: go mod verify
        entry: go mod verify
        language: system
        files: go\.(mod|sum)$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet
        language: system
        args: ['./...']
        files: \.go$
        pass_filenames: false
