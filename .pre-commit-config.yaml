# ABOUTME: Pre-commit hooks configuration for ccvault project
# ABOUTME: Runs formatting, linting, and tests before each commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^go\.(mod|sum)$
      - id: end-of-file-fixer
        exclude: ^go\.(mod|sum)$
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Block files > 1MB (except binary)
        exclude: ^ccvault$  # Allow the binary
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # gofmt reformats doc comments as well as code, and that includes the
      # legacy godoc typographic convention: inside a comment attached to a
      # declaration, `` becomes a left double quote and '' becomes a right
      # double quote. It is upstream Go behaviour with no flag to disable it,
      # so -d is here to make it visible — the hook prints the diff it wrote
      # back instead of only naming the file. Free-floating comments and
      # single quotes such as '%' are untouched; only the paired forms are
      # rewritten, and a doc comment that needs them should put them in a
      # backquoted code span.
      - id: go-fmt
        args: ['-d']
      - id: go-imports
      - id: go-mod-tidy
      # --allow-parallel-runners: golangci-lint takes an exclusive lock by
      # default and fails with "parallel golangci-lint is running" rather
      # than waiting, so two concurrent commits in this repo turn one commit
      # into a spurious hook failure.
      - id: golangci-lint
        args: ['--timeout=10m', '--fix', '--allow-parallel-runners']
      # No go-unit-tests here on purpose. That hook's script takes no
      # arguments, so the `args:` this repo gave it -- -race, -count=1,
      # ./... -- were silently discarded and the gate was substantially
      # weaker than the config read. See the go-test-race hook below.

  - repo: local
    hooks:
      - id: go-mod-verify
        name: go mod verify
        entry: go mod verify
        language: system
        files: go\.(mod|sum)$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet
        language: system
        args: ['./...']
        files: \.go$
        pass_filenames: false

      # Replaces dnephin/pre-commit-golang's go-unit-tests, which ignored the
      # args this repo passed it. Its script is, verbatim:
      #
      #   FILES=$(go list ./... | grep -v /vendor/) || fail
      #   go test -tags=unit -timeout 30s -short -v ${FILES} || fail
      #
      # So `-race` had never run at commit time, `-short` skipped the
      # integration suite outright, and the 30s budget was tight enough that a
      # slow package produced a goroutine dump reading like a deadlock -- a
      # failure that teaches you to re-run rather than to look.
      #
      # The scope lives in `make test-precommit` so there is one definition of
      # it rather than a shell line here and a different one in CI. That target
      # states which packages it skips and why; `name:` below repeats it,
      # because the hook's one line of output is where most people will read it.
      #
      # Last in the file deliberately: go-vet above fails in a second or two,
      # so a trivially broken tree never pays for a test run.
      - id: go-test-race
        name: go test -race (all packages except internal/db, internal/mcp)
        entry: make test-precommit
        language: system
        files: \.go$
        pass_filenames: false
