# ABOUTME: GitHub Actions release workflow for ccvault, triggered by a v* tag
# ABOUTME: Builds macOS artifacts with GoReleaser and the Linux binary directly
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# checkout and setup-go are on their Node 24 majors, matching ci.yml. What
# those bumps changed beyond the runtime is written out once, at the top of
# ci.yml; bump the two files together so a tag never runs an action major that
# no PR has exercised.

# GOTOOLCHAIN=local, for the same reason CI sets it: setup-go below installs
# the version go.mod names, and left unset the toolchain would quietly
# download and use a different one if that install ever came up short. A
# release artifact built by a compiler nobody chose, and that CI never ran
# against, is worse than a tag that fails loudly and gets re-cut.
env:
  GOTOOLCHAIN: local

jobs:
  release-darwin:
    name: Release (macOS)
    # Pinned image, not `macos-latest`, for the same reason release-linux is:
    # goreleaser builds this job's artifacts with CGO_ENABLED=1, so the runner
    # image's clang and SDKs decide which macOS versions the binaries we
    # publish will run on, and a floating label lets an image major change
    # that with no commit from this repo -- on a tag, where it is most
    # expensive to discover.
    #
    # #133 held this back from the earlier pinning pass for a good reason: the
    # label could not be verified without cutting a tag, and a wrong label
    # breaks the release outright where floating currently works. That is now
    # answered rather than guessed at. ci.yml's `Build (macOS)` job runs on
    # this same label on every pull request and performs the same cgo build
    # for both darwin arches, so the label is exercised continuously, and the
    # first PR carrying this pin is itself the proof.
    #
    # `macos-26` is the arm64 macOS 26 image, which is what `macos-latest`
    # already resolved to for the v0.3.0 release, so this freezes the current
    # image rather than changing it. `macos-26-arm64` is that image's *name*
    # in actions/runner-images, not a usable label -- the arm64 labels are
    # `macos-latest`, `macos-26` and `macos-26-xlarge`. Keep this in step with
    # ci.yml's macOS job, and move both on a PR.
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Release with the toolchain go.mod declares, not a hardcoded
          # version that the auto-download then replaces.
          go-version-file: go.mod
          cache: true

      # goreleaser-action v7 is the Node 24 major, and it carries one change
      # beyond the runtime: from v7.1.0 the action verifies what it downloads.
      # It fetches checksums.txt for the pinned release, hard-fails on a
      # SHA-256 mismatch or a missing entry, and additionally verifies
      # checksums.txt.sigstore.json with cosign when cosign is on PATH --
      # degrading to a warning when an artifact or the tool is absent. The
      # v2.18.2 release publishes both checksums.txt and the sigstore bundle,
      # and CI's `Release config` job runs this same install path, against this
      # same pin, on every PR. So the verification is proven green before any
      # tag reaches this job.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Explicit version, never `latest`. With `latest` the release used
          # whichever GoReleaser shipped most recently at tag time, so the same
          # tag could build differently next month and an upstream breaking
          # change would land on a tag rather than on a PR. This pin is the
          # version CI's Release config job runs `goreleaser check` against;
          # bump both together, and mise.toml with them.
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  release-linux:
    name: Release (Linux)
    # Pinned image, not `ubuntu-latest`. The build step below is
    # CGO_ENABLED=1, so the released binary is compiled by this runner's gcc
    # and linked against its glibc -- the runner-image major therefore decides
    # which Linux systems the artifact we publish will actually run on. GitHub
    # migrates the `ubuntu-latest` label to Ubuntu 26 starting 2026-10-19
    # (actions/runner-images#14748), and this job only ever runs on a tag, so
    # with a floating label that migration would first be observed after the
    # tag is pushed -- the most expensive place to find it. ubuntu-24.04 is
    # what `ubuntu-latest` resolved to for the v0.3.0 release, so this pin
    # freezes the image rather than changing it. Keep it in step with the pins
    # in ci.yml, and move both on a PR.
    runs-on: ubuntu-24.04
    needs: release-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Release with the toolchain go.mod declares, not a hardcoded
          # version that the auto-download then replaces.
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        run: |
          # Build linux/amd64 only (ARM64 cross-compile has CGO issues with DuckDB)
          CGO_ENABLED=1 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -tags sqlite_omit_load_extension -o ccvault-linux-amd64 ./cmd/ccvault

      - name: Create archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # Create amd64 archive
          mkdir -p ccvault_${VERSION}_Linux_x86_64
          cp ccvault-linux-amd64 ccvault_${VERSION}_Linux_x86_64/ccvault
          cp README.md ccvault_${VERSION}_Linux_x86_64/ 2>/dev/null || true
          tar -czvf ccvault_${VERSION}_Linux_x86_64.tar.gz ccvault_${VERSION}_Linux_x86_64

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release upload ${GITHUB_REF_NAME} \
            ccvault_${VERSION}_Linux_x86_64.tar.gz \
            --clobber
