# ABOUTME: GitHub Actions CI workflow for ccvault
# ABOUTME: Runs tests, linting, and builds on the Go versions go.mod supports
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GOTOOLCHAIN=local is what makes every go-version below mean what it says.
# Left unset, the toolchain silently downloads whatever go.mod asks for and
# runs that instead, so a job labelled with one version can be compiling with
# another. With it set, a version too old for go.mod fails the job.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod declares `go 1.25.5`, so that is the supported floor and the
        # only version this project claims to build on. `stable` runs beside
        # it as forward warning: it catches a new Go release breaking the
        # build before a contributor on current Go hits it.
        go-version: ['1.25.5', 'stable']
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify the toolchain is the one this job names
        run: |
          go version
          echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
          test "$(go env GOTOOLCHAIN)" = local

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test-race

      # Coverage comes from the floor job: one upload, from the version the
      # project supports rather than whatever `stable` happens to be.
      - name: Run tests with coverage
        if: matrix.go-version == '1.25.5'
        run: make test-coverage

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.25.5'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=10m
          verify: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Verify binary
        run: ./ccvault --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccvault-linux-amd64
          path: ccvault
          retention-days: 7
