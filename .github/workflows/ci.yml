# ABOUTME: GitHub Actions CI workflow for ccvault
# ABOUTME: Runs tests, linting, and builds on the Go versions go.mod supports
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GOTOOLCHAIN=local is what makes every go-version below mean what it says.
# Left unset, the toolchain silently downloads whatever go.mod asks for and
# runs that instead, so a job labelled with one version can be compiling with
# another. With it set, a version too old for go.mod fails the job.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod declares `go 1.25.5`, so that is the supported floor and the
        # only version this project claims to build on. `stable` runs beside
        # it as forward warning: it catches a new Go release breaking the
        # build before a contributor on current Go hits it.
        go-version: ['1.25.5', 'stable']
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify the toolchain is the one this job names
        run: |
          go version
          echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
          test "$(go env GOTOOLCHAIN)" = local

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test-race

      # Coverage comes from the floor job: one upload, from the version the
      # project supports rather than whatever `stable` happens to be.
      - name: Run tests with coverage
        if: matrix.go-version == '1.25.5'
        run: make test-coverage

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.25.5'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Must match mise.toml's golangci-lint pin, or a developer and CI
          # lint with different rule sets and disagree in both directions.
          #
          # This pin is coupled to the Go toolchain, so it moves when go.mod's
          # Go version does. golangci-lint type-checks with the go/types
          # vendored into the version you run, and that copy refuses any file
          # requiring a newer Go than it was built with. The old v2.7.2 pin is
          # built with go1.25, so it panics outright on a toolchain where a
          # dependency declares go1.26 -- it survived here only because the
          # runner's Go happened to match it, while contributors on current Go
          # could not lint at all. It also reported gosec G602 on bounds it
          # could not prove, which cost a round-trip on #118.
          version: v2.11.4
          args: --timeout=10m
          verify: false

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # `goreleaser check` catches deprecated and invalid keys in seconds. It
      # belongs on every PR because the alternative is finding out at tag time,
      # when the fix costs a deleted tag and a re-cut release.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Must match the pin in release.yml, so this job validates the config
          # against the exact binary that will build the release.
          version: v2.18.2
          install-only: true

      # `goreleaser check` exits non-zero for a deprecated key just as it does
      # for an invalid one, and .goreleaser.yml still uses `brews` on purpose
      # (see the comment there, and 2389-research/homebrew-tap#1). So that one
      # deprecation is tolerated and everything else fails.
      #
      # Fail-closed by construction: the job passes only when `check` exits 0,
      # or when it fails with the deprecation-only message AND every DEPRECATED
      # line names `brews`. An invalid key, a second deprecation, upstream
      # removing `brews` outright, or goreleaser rewording its own output all
      # fail the job rather than passing quietly. That last case is the point --
      # it means the removal lands on a PR instead of on a tag.
      - name: Check .goreleaser.yml
        run: |
          status=0
          raw=$(goreleaser check 2>&1) || status=$?
          printf '%s\n' "$raw"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # goreleaser colourises its output here even with no TTY, and it wraps
          # the key name in escapes -- `brews` arrives as ESC[94mbrews ESC[0m,
          # so matching the plain word fails. Strip ANSI before matching rather
          # than setting NO_COLOR, which goreleaser ignores when something has
          # already forced colour on. ESC is built with printf so this works
          # under BSD sed as well as GNU.
          esc=$(printf '\033')
          output=$(printf '%s\n' "$raw" | sed "s/${esc}\[[0-9;]*m//g")

          if ! printf '%s\n' "$output" | grep -qF 'configuration is valid, but uses deprecated properties'; then
            echo "::error::goreleaser check failed for a reason other than a deprecated key."
            exit "$status"
          fi

          if printf '%s\n' "$output" | grep -F 'DEPRECATED:' | grep -qvF ' brews '; then
            echo "::error::goreleaser check reports a deprecation other than the known 'brews' one."
            exit "$status"
          fi

          echo "::notice::Only the known 'brews' deprecation, tracked in 2389-research/homebrew-tap#1."

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Verify binary
        run: ./ccvault --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccvault-linux-amd64
          path: ccvault
          retention-days: 7
