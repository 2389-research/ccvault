# ABOUTME: GitHub Actions CI workflow for ccvault
# ABOUTME: Runs tests, linting, and builds on the Go versions go.mod supports
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Action majors here and in release.yml are the Node 24 ones. The previous
# pins all targeted Node 20, which GitHub already force-runs on Node 24, so
# they were being migrated for us -- the same unprompted-change shape the
# runner-image pin below exists to stop. What each bump changed beyond the
# runtime, checked against what this repo uses:
#
#   actions/checkout  v4 -> v7  v6.0.0 persists git credentials to a separate
#                               file; v6.0.2 fixed tag handling so annotated
#                               tags stay annotated, which goreleaser reads for
#                               the changelog; v7 blocks checking out a fork PR
#                               head under `pull_request_target` /
#                               `workflow_run`, neither of which we trigger on.
#   actions/setup-go  v5 -> v7  v6 sets GOTOOLCHAIN=local itself, matching what
#                               the `env:` below already asserts, and prefers
#                               go.mod's `toolchain` directive over its `go`
#                               directive -- a no-op here, go.mod declares no
#                               toolchain line. v7 is ESM plus a cache-library
#                               bump.
#
# The golangci-lint and goreleaser bumps are noted at their own steps.

# GOTOOLCHAIN=local is what makes every go-version below mean what it says.
# Left unset, the toolchain silently downloads whatever go.mod asks for and
# runs that instead, so a job labelled with one version can be compiling with
# another. With it set, a version too old for go.mod fails the job.
#
# setup-go v6 and later export GOTOOLCHAIN=local themselves, so this is now
# belt-and-braces rather than the only thing holding the property. Keep it: it
# is what the `Verify the toolchain` step asserts, it covers the jobs that
# never call setup-go, and it keeps the guarantee ours rather than the
# action's to withdraw.
env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    # Pinned image, not `ubuntu-latest`. ccvault is a cgo build -- DuckDB and
    # go-sqlite3 are both cgo packages -- so every job here compiles against
    # the runner's gcc, glibc and libstdc++, and a runner-image major swaps all
    # three out from under us with no commit from this repo. GitHub migrates
    # the `ubuntu-latest` label to Ubuntu 26 starting 2026-10-19
    # (actions/runner-images#14748). Pinning means that migration lands on a PR
    # we open, with a CI run to read, instead of arriving unannounced -- and it
    # keeps CI compiling on the same image the release job uses. `ubuntu-latest`
    # resolved to ubuntu-24.04 for the v0.3.0 release, so this pin freezes the
    # image rather than changing it.
    #
    # Do not "modernise" this back to `ubuntu-latest`. To move images, bump
    # every `ubuntu-24.04` in .github/workflows together, on a PR, and read the
    # resulting CI run before merging.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # go.mod declares `go 1.25.5`, so that is the supported floor and the
        # only version this project claims to build on. `stable` runs beside
        # it as forward warning: it catches a new Go release breaking the
        # build before a contributor on current Go hits it.
        #
        # This number is one of three that must agree -- go.mod's directive,
        # mise.toml's `go` pin, and this floor -- and it is not free to move on
        # its own: go.mod's directive is capped by the Go version the pinned
        # golangci-lint was built with. mise.toml documents the order to move
        # the set in; #98 is where raising the floor gets argued.
        go-version: ['1.25.5', 'stable']
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `cache: true` is the only module cache in this job. There used to be a
      # hand-rolled `actions/cache` step after this one caching ~/go/pkg/mod
      # as well -- the same directory setup-go already handles, restored twice
      # and saved twice per job. Its key was
      # `${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}`, which names no Go
      # version, so both matrix jobs shared one entry and each overwrote a
      # cache the other toolchain had populated. setup-go's own key carries
      # the Go version alongside the go.sum hash, which is exactly the
      # dimension the manual key was missing, so deleting the step fixes the
      # collision rather than trading it for a different one.
      #
      # It cached nothing extra either: setup-go covers the build cache
      # (~/.cache/go-build) as well as the module cache. If a future step
      # needs something outside both, scope `actions/cache` to that path only
      # and put the Go version in its key.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify the toolchain is the one this job names
        run: |
          go version
          echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
          test "$(go env GOTOOLCHAIN)" = local

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test-race

      # Coverage comes from the floor job: one upload, from the version the
      # project supports rather than whatever `stable` happens to be.
      #
      # Selected by excluding `stable` rather than by naming the floor, so
      # raising go.mod's Go version cannot silently switch coverage off here by
      # leaving a stale literal behind. A third pinned entry in the matrix
      # would give two uploads, which is loud; a stale literal gives none,
      # which is not.
      #
      # This profiles every package now rather than two of them, so it is a
      # second full pass over the suite after `make test-race` above and the
      # job is correspondingly longer. Worth it: the number this uploads is
      # labelled as the project's, and a second run without -race is what
      # makes that label true. Not folded into the -race run, because
      # -covermode=atomic there would measure a differently-instrumented
      # binary and slow the pass everyone reads for pass/fail.
      - name: Run tests with coverage
        if: matrix.go-version != 'stable'
        run: make test-coverage

      # v7 is the Node 24 major, and getting here from v4 crosses a rewrite,
      # so this is not the drop-in the other action bumps were. v5 replaced the
      # action's own uploader with a wrapper around the Codecov CLI, and
      # renamed inputs in the process: `file` became `files`, and `file` is
      # simply absent from v7's action.yml.
      #
      # That rename is the whole risk, because GitHub only *warns* about an
      # input an action does not declare. Left as `file`, this step would keep
      # passing, keep saying it uploaded, and never be told which file to
      # upload -- the CLI would fall back to searching the tree, so the
      # outcome would depend on what it happened to find rather than on what
      # `make test-coverage` just wrote. A silent change of meaning is worse
      # here than a failure would be.
      #
      # v6 is Node 24 by default; v7 only changes which account holds
      # Codecov's GPG signing key.
      #
      # No token is set, and this comment used to claim none was needed
      # because the repo is public. That is false, measured. The upload is
      # rejected every run, and has been since before the flag below changed:
      #
      #   info  -- Found 1 coverage files to report
      #   info  -- > /home/runner/work/ccvault/ccvault/coverage.out
      #   info  -- Upload queued for processing complete
      #   error -- Upload queued for processing failed:
      #            {"message":"Token required because branch is protected"}
      #
      # `fail_ci_if_error: false` is why nobody noticed -- it is there so a
      # Codecov outage cannot redden a PR that has nothing wrong with it, and
      # it swallows this too, so the step goes green while publishing nothing.
      # Note the ordering: "complete" is printed before the error, so reading
      # only the happy line tells you the opposite of what happened.
      #
      # Fixing it needs a CODECOV_TOKEN repository secret, which is a
      # credential decision and not this PR's to make. Left failing and
      # documented rather than silently papered over; the point of #151 is
      # that the profile is now honest, and the number is not published at
      # all until that token exists.
      #
      # `flags: project`, not the `unittests` it said before. That label was
      # inherited from a `make test-coverage` that profiled two packages of
      # 22, so the figure under it described neither the project nor its unit
      # tests. The target now profiles everything, integration suite included,
      # and this is the only upload, so `project` is what the number is. The
      # old flag's history is left where it is: it measured a different thing
      # and merging the two series would hide the step.
      - name: Upload coverage to Codecov
        if: matrix.go-version != 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: project
          fail_ci_if_error: false

  lint:
    name: Lint
    # Pinned for the cgo reason documented on the `test` job above; all jobs
    # in this repo stay on one image so CI and the release agree.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # v9 is the Node 24 major; v7 targeted Node 20 and was already being
      # force-migrated. Checked against what this step uses: v8 made
      # `working-directory` resolve to absolute paths (not set here) and
      # requires golangci-lint >= v2.1.0 (pinned below at v2.11.4); v9 only
      # adds `install-only` and module-plugin support. `version`, `args` and
      # `verify` all survive unchanged.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must match mise.toml's golangci-lint pin, or a developer and CI
          # lint with different rule sets and disagree in both directions.
          #
          # This pin is coupled to the Go toolchain, so it moves when go.mod's
          # Go version does. golangci-lint type-checks with the go/types
          # vendored into the version you run, and that copy refuses any file
          # requiring a newer Go than it was built with. The old v2.7.2 pin is
          # built with go1.25, so it panics outright on a toolchain where a
          # dependency declares go1.26 -- it survived here only because the
          # runner's Go happened to match it, while contributors on current Go
          # could not lint at all. It also reported gosec G602 on bounds it
          # could not prove, which cost a round-trip on #118.
          #
          # v2.11.4 is built with go1.26.1 (`golangci-lint version` prints the
          # Go it was built with), so it is also the ceiling on go.mod's `go`
          # directive. Measured, at `go 1.27.0`, this step fails with:
          #
          #   can't load config: the Go language version (go1.26) used to
          #   build golangci-lint is lower than the targeted Go version
          #   (1.27.0)
          #
          # Clearer than the old panic, still a hard stop. Raising the floor
          # past 1.26 means raising this pin first.
          version: v2.11.4
          args: --timeout=10m
          verify: false

  release-config:
    name: Release config
    # No cgo in this job, but it is pinned with the rest so one image governs
    # the repo -- see the note on the `test` job above. A workflow where some
    # jobs float and others do not is the version nobody can reason about.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # `goreleaser check` catches deprecated and invalid keys in seconds. It
      # belongs on every PR because the alternative is finding out at tag time,
      # when the fix costs a deleted tag and a re-cut release.
      #
      # This step also serves a second purpose now: it is the only place the
      # goreleaser-action v7 install path runs on a PR. v7 is more than a Node
      # 24 bump -- since v7.1.0 the action downloads checksums.txt and verifies
      # the SHA-256 of the archive it just fetched, and verifies the sigstore
      # bundle too when cosign is on PATH. That is a new way for the release to
      # fail, so it is worth exercising here, against the same v2.18.2 pin, on
      # every PR rather than first on a tag.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Must match the pin in release.yml, so this job validates the config
          # against the exact binary that will build the release.
          version: v2.18.2
          install-only: true

      # `goreleaser check` exits non-zero for a deprecated key just as it does
      # for an invalid one, and .goreleaser.yml still uses `brews` on purpose
      # (see the comment there, and 2389-research/homebrew-tap#1). So that one
      # deprecation is tolerated and everything else fails.
      #
      # Fail-closed by construction: the job passes only when `check` exits 0,
      # or when it fails with the deprecation-only message AND every DEPRECATED
      # line names `brews`. An invalid key, a second deprecation, upstream
      # removing `brews` outright, or goreleaser rewording its own output all
      # fail the job rather than passing quietly. That last case is the point --
      # it means the removal lands on a PR instead of on a tag.
      - name: Check .goreleaser.yml
        run: |
          status=0
          raw=$(goreleaser check 2>&1) || status=$?
          printf '%s\n' "$raw"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # goreleaser colourises its output here even with no TTY, and it wraps
          # the key name in escapes -- `brews` arrives as ESC[94mbrews ESC[0m,
          # so matching the plain word fails. Strip ANSI before matching rather
          # than setting NO_COLOR, which goreleaser ignores when something has
          # already forced colour on. ESC is built with printf so this works
          # under BSD sed as well as GNU.
          esc=$(printf '\033')
          output=$(printf '%s\n' "$raw" | sed "s/${esc}\[[0-9;]*m//g")

          if ! printf '%s\n' "$output" | grep -qF 'configuration is valid, but uses deprecated properties'; then
            echo "::error::goreleaser check failed for a reason other than a deprecated key."
            exit "$status"
          fi

          if printf '%s\n' "$output" | grep -F 'DEPRECATED:' | grep -qvF ' brews '; then
            echo "::error::goreleaser check reports a deprecation other than the known 'brews' one."
            exit "$status"
          fi

          echo "::notice::Only the known 'brews' deprecation, tracked in 2389-research/homebrew-tap#1."

  build:
    name: Build
    # Pinned for the cgo reason documented on the `test` job above; all jobs
    # in this repo stay on one image so CI and the release agree.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Verify binary
        run: ./ccvault --help

      # v7 is the Node 24 major; v4 targeted Node 20. Checked against the three
      # inputs this step sets, all of which survive unchanged: v5 was a
      # preliminary Node 24 build that still defaulted to Node 20; v6 made Node
      # 24 the default and raised the minimum Actions runner to 2.327.1, which
      # only matters for self-hosted runners and this repo has none; v7 moved
      # the action to ESM and added an optional `archive` input that defaults
      # to true, i.e. the v4 behaviour of zipping the upload.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccvault-linux-amd64
          path: ccvault
          retention-days: 7

  build-darwin:
    name: Build (macOS)
    # This job exists to make `release-darwin` verifiable. That job builds the
    # released macOS binaries with CGO_ENABLED=1 and runs only on a tag, so
    # until now the runner image it compiles against was first observed after
    # the tag was pushed -- which is why #133 argued its `macos-latest` could
    # not safely be pinned: choosing a label meant guessing one for a job
    # nobody could exercise.
    #
    # Pinned to the same label `release-darwin` now uses, and triggered by
    # `pull_request` like the rest of this file, so the label and the cgo
    # toolchain behind it are proven on a PR instead of on a tag. If GitHub
    # retires `macos-26`, this job fails here first.
    #
    # `macos-26` is the arm64 macOS 26 image, which is what `macos-latest`
    # already resolved to for the v0.3.0 release -- so, like the ubuntu-24.04
    # pins, this freezes the current image rather than changing it. Note that
    # `macos-26-arm64` is the image *name* in actions/runner-images and not a
    # usable label; the arm64 labels are `macos-latest`, `macos-26` and
    # `macos-26-xlarge`. Pinning to the image name would have failed outright.
    runs-on: macos-26
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Report the runner image
        run: |
          sw_vers
          uname -m
          cc --version

      # Mirrors .goreleaser.yml's `ccvault` build: CGO_ENABLED=1, the
      # sqlite_omit_load_extension tag, and both darwin arches. amd64 on an
      # arm64 runner is a cgo cross-compile that leans on the SDKs the runner
      # image ships, so it is the half most exposed to an image change and the
      # half worth compiling here. Packaging is left to goreleaser; this job
      # is about whether the code compiles on this image, which is what a
      # runner-image major puts at risk.
      - name: Build both darwin arches the release builds
        env:
          CGO_ENABLED: '1'
        run: |
          for arch in arm64 amd64; do
            echo "::group::darwin/$arch"
            GOARCH="$arch" go build -tags sqlite_omit_load_extension \
              -o "ccvault-darwin-$arch" ./cmd/ccvault
            echo "::endgroup::"
          done
          file ccvault-darwin-arm64 ccvault-darwin-amd64

      # Only the native build can be executed on this runner.
      - name: Verify the native binary runs
        run: ./ccvault-darwin-arm64 --help
