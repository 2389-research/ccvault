# GoReleaser configuration for ccvault
# macOS binaries built by GoReleaser, Linux binaries built separately in CI
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ccvault
    binary: ccvault
    main: ./cmd/ccvault
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - sqlite_omit_load_extension

archives:
  - id: ccvault
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - docs/**/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Other'
      order: 999

# Homebrew Cask, not Formula. GoReleaser soft-deprecated `brews` in v2.10 and
# hard-deprecated it in v2.16; `goreleaser check` fails on it, and the next
# major removes it outright. A Cask is the supported way to ship a
# pre-compiled binary through a tap, so this writes Casks/ccvault.rb rather
# than Formula/ccvault.rb.
#
# Two consequences of the switch, both deliberate:
#   - `test:` has no Cask equivalent, so the old `ccvault version` smoke test
#     is gone. Casks are not built from source and Homebrew does not run one.
#   - `license:` is accepted by the schema but never rendered into a Cask, so
#     it is dropped instead of kept as dead config.
homebrew_casks:
  - name: ccvault
    repository:
      owner: 2389-research
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/2389-research/ccvault
    description: "Claude Code conversation archive and analysis tool"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # Cask equivalent of the old `bin.install "ccvault"`: symlink this
    # executable out of the staged archive onto the PATH.
    binaries:
      - ccvault
    # There is no `conflicts: [formula: ccvault]` guarding against the old
    # Formula still being installed, because Homebrew removed Cask-vs-Formula
    # conflicts (Homebrew/brew#20499) and GoReleaser deprecated the field to
    # match: it would be a no-op that fails `goreleaser check`. Anyone on the
    # old Formula has to `brew uninstall ccvault` before installing the Cask.
    #
    # Homebrew quarantines Cask downloads, and these binaries are unsigned, so
    # without this Gatekeeper reports "ccvault is damaged and cannot be
    # opened". Formulae were never quarantined, which is why this hook is new.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ccvault"]
          end
