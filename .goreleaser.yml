# GoReleaser configuration for ccvault
# macOS binaries built by GoReleaser, Linux binaries built separately in CI
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ccvault
    binary: ccvault
    main: ./cmd/ccvault
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - sqlite_omit_load_extension

archives:
  - id: ccvault
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - docs/**/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Other'
      order: 999

# `brews` is deprecated in favour of `homebrew_casks`, and that migration is
# deliberately NOT done here. Do not "fix" this in passing.
#
# The deprecation is soft: it fails `goreleaser check` and nothing else.
# Verified on goreleaser 2.18.2 -- a real release still writes the formula and
# exits 0, reporting only "you are using deprecated options". So the present
# cost of staying is a red `check`, while the cost of migrating is that every
# existing tap user must run `brew uninstall ccvault` by hand, because
# GoReleaser would stop writing Formula/ccvault.rb and Homebrew will not
# replace a Formula with a Cask on its own.
#
# That trade is not ours to make one repo at a time: 14 of 18 repos in the org
# are in the same position, and the tap already carries Casks whose Formulae
# were deleted rather than kept alongside. It is tracked tap-wide in
# 2389-research/homebrew-tap#1, which is also where the signing-and-notarizing
# approach lives -- Casks are quarantined on download, and the org already
# solves that with a Developer ID cert rather than by stripping the attribute.
#
# CI's Release config job tolerates exactly this one deprecation and fails on
# anything else, including upstream finally removing `brews`.
brews:
  - repository:
      owner: 2389-research
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/2389-research/ccvault
    description: "Claude Code conversation archive and analysis tool"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "ccvault"
    test: |
      system "#{bin}/ccvault", "version"
