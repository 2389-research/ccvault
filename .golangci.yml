version: "2"

# ABOUTME: golangci-lint config for ccvault. Enables gosec, bodyclose,
# sqlclosecheck, and errorlint in addition to the default linters.

run:
  timeout: 5m

linters:
  default: standard
  enable:
    # Security lens — flag SQL injection risk, hardcoded credentials,
    # weak crypto. This is what "0 issues" should actually be checking
    # against.
    #
    # NOTE: G304 (Potential file inclusion via variable) is DISABLED
    # globally below. ccvault is a filesystem archival tool — every
    # adapter, parser, sync, and analytics module has a legitimate
    # reason to open files whose paths come from disk traversal or
    # user config. Firing G304 at every one of them buries the signal.
    # Reviewers who want to argue for scoping-in a specific unsafe path
    # site should re-enable G304 there via a nolint comment.
    - gosec
    # Ensure http response bodies get closed.
    - bodyclose
    # Ensure sql.Rows/sql.Stmt handles are closed.
    - sqlclosecheck
    # Catch fmt.Errorf(%s, err) drift when the callsite could use %w.
    - errorlint
    # Ensure context is threaded correctly.
    - contextcheck

  settings:
    gosec:
      # G304 is a whole-project no-op given ccvault's file-archival
      # domain — disable so the remaining gosec rules stay signal.
      excludes:
        - G304

  exclusions:
    generated: strict
    rules:
      # Whitelisted query builders in internal/db/projects.go accept
      # validated string args (map lookup with default fallback) —
      # gosec flags them as SQL string formatting, but the input set
      # is closed. Suppress G201.
      - path: internal/db/projects\.go
        linters:
          - gosec
        text: "G201"
      # False positive: "tokens" in the sort-column whitelist is a
      # column name (total_tokens), not a credential.
      - path: internal/db/projects\.go
        linters:
          - gosec
        text: "G101"
      # G202 in ResetAll: "DELETE FROM " + table where table comes
      # from a hardcoded []string literal, not user input.
      - path: internal/db/db\.go
        linters:
          - gosec
        text: "G202"
      # Analytics DuckDB queries build SQL with fmt.Sprintf for the
      # parquet file path (from config, not user data) plus integer
      # LIMIT/days — the row-value params ARE bound. G201 rings false.
      # Same pattern in export.go for directory perms and int32 conv.
      - path: internal/analytics/queries\.go
        linters:
          - gosec
        text: "G20[12]"
      - path: internal/analytics/export\.go
        linters:
          - gosec
        text: "G(30[126]|115)"
      # Test fixtures create files/dirs with dev-permissive modes so
      # the tests can run under any UID. Not shipping code — suppress
      # G301/G302/G306 in _test.go across the tree.
      - path: .*_test\.go
        linters:
          - gosec
        text: "G30[126]"
